services:
  api:
    build: .
    image: pdf-extraction-service
    restart: unless-stopped
    environment:
      - EXTRACT_CONCURRENCY=${EXTRACT_CONCURRENCY:-3}
      - EXTRACT_QUEUE_TIMEOUT=${EXTRACT_QUEUE_TIMEOUT:-10}
      - EXTRACT_MAX_QUEUE=${EXTRACT_MAX_QUEUE:-8}
      - EXTRACT_CACHE_SIZE=${EXTRACT_CACHE_SIZE:-32}
      - PDF_MAX_FILE_SIZE_MB=50
    deploy:
      replicas: 5
      resources:
        limits:
          cpus: '1.0'
          memory: '1G'
    expose:
      - "80"
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.extractor.rule=Host(`extractor.universidad.localhost`) && PathPrefix(`/extract`)
      - traefik.http.routers.extractor.entrypoints=https
      - traefik.http.routers.extractor.tls=true
      - traefik.http.services.extractor.loadbalancer.server.port=80
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:80/health').getcode()==200 else 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  proxy:
    external: true
    name: proxy
