services:
  api:
    build: .
    image: pdf-extraction-service
    restart: unless-stopped
    environment:
      - PDF_MAX_PAGES=50
      - PDF_MAX_FILE_SIZE_MB=50
    deploy:
      replicas: 5
      resources:
        limits:
          cpus: '1.0'
          memory: '1G'
    expose:
      - "80"
    networks:
      - proxy
    # Traefik labels will be added later as needed

  load-generator:
    image: peterevans/vegeta:latest
    command: ["sh", "-c", "sleep 5 && vegeta attack -rate=50 -duration=30s -timeout=30s http://api:80/api/v1/extract -body 'file@/pdfs/prueba.pdf' | vegeta results -type=text > /results.txt"]
    environment:
      - PDF_PATH=/pdfs/prueba.pdf
    volumes:
      - ./tests/stress/vegeta_targets.txt:/vegeta_targets.txt:ro
      - ./tests/stress/pdfs:/pdfs:ro
      - ./tests/stress/results:/results
    profiles:
      - testing
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: proxy
