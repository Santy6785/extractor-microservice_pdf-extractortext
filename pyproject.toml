[project]
name = "pdf-extractor"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.0.0",
    "pymupdf>=1.24,<2",
    "python-multipart>=0.0.18",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "httpx>=0.27.0", "pytest-asyncio>=0.23.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-vv"
